<style>
/* Layout: one-column travel app – header s odpočtom, sticky záložky, karty dní ako časová os */
:root{
  --bg:#eef3f2;          /* vápencová biela s nádychom mora */
  --surface:#ffffff;
  --ink:#0f2a33;
  --muted:#557079;
  --line:#d3e0df;
  --sea:#0c6070;         /* hlboké more */
  --sea-soft:#dcedee;
  --mares:#b9802a;       /* pieskovec marès */
  --mares-soft:#f5ead6;
  --ok:#2f7d4a; --warn:#a0610b; --warn-soft:#fbefd9;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1a1f; --surface:#12262d; --ink:#e4efee; --muted:#93acb1; --line:#23404a;
  --sea:#5cc0cf; --sea-soft:#163a43; --mares:#e0ac55; --mares-soft:#352a17;
  --ok:#6cc68a; --warn:#e9a84a; --warn-soft:#33270f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1a1f; --surface:#12262d; --ink:#e4efee; --muted:#93acb1; --line:#23404a;
  --sea:#5cc0cf; --sea-soft:#163a43; --mares:#e0ac55; --mares-soft:#352a17;
  --ok:#6cc68a; --warn:#e9a84a; --warn-soft:#33270f; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
a{color:var(--sea)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mares);outline-offset:2px}

/* Header */
header.top{padding-block:28px 18px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
header.top h1{font-size:clamp(34px,7vw,52px);font-weight:700;letter-spacing:-.01em;margin-top:4px}
header.top h1 span{color:var(--sea)}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;color:var(--muted)}
.count{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
.count b{font-family:var(--display);font-size:28px;color:var(--mares);font-variant-numeric:tabular-nums}

/* Tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:15px}
nav.tabs button[aria-selected="true"]{background:var(--sea);border-color:var(--sea);color:var(--bg)}
section.panel{padding-top:20px}
section.panel > h2{font-size:26px;margin-bottom:6px}
.lead{color:var(--muted);margin:0 0 18px;max-width:62ch}

/* Day switcher */
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:18px}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;cursor:pointer;text-align:center}
.days button small{display:block;color:var(--muted);font-size:12px}
.days button strong{font-family:var(--display);font-size:20px}
.days button[aria-pressed="true"]{border-color:var(--sea);box-shadow:inset 0 0 0 2px var(--sea)}
.days button.today::after{content:attr(data-today);display:block;font-size:11px;color:var(--mares);font-weight:700}

.dayhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:baseline;margin-bottom:6px}
.dayhead h3{font-size:24px}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sea-soft);color:var(--sea)}
.chip.m{background:var(--mares-soft);color:var(--mares)}
.daynote{color:var(--muted);margin:4px 0 16px;max-width:62ch}

ol.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
ol.tl li{position:relative;padding:0 0 18px 20px}
ol.tl li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--sea)}
ol.tl li.done::before{background:var(--sea)}
ol.tl li.done .what{text-decoration:line-through;color:var(--muted)}
.row{display:flex;gap:12px;align-items:flex-start}
.time{font-variant-numeric:tabular-nums;font-weight:700;color:var(--sea);min-width:60px}
.body{min-width:0;flex:1}
.what{font-weight:700}
.det{color:var(--muted);font-size:15px;margin-top:2px}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:14px}
.tick{margin-left:auto;flex:0 0 auto;width:22px;height:22px;accent-color:var(--sea);cursor:pointer}
.alert{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;margin:0 0 16px;border:1px solid var(--line)}
.alert b{color:var(--warn)}
.planb{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;margin-top:4px}
.planb b{color:var(--mares)}

/* Stays */
.stays{display:grid;gap:14px}
.stay{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stay.fav{border-color:var(--mares);box-shadow:0 0 0 2px var(--mares) inset}
.stay h3{font-size:21px}
.stay .sub{color:var(--muted);font-size:15px;margin-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:15px}
.pc ul{margin:4px 0 0;padding-left:18px}
.pc h4{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--sea);color:var(--sea);background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer}
.btn.solid{background:var(--sea);color:var(--bg)}
.btn.gold{border-color:var(--mares);color:var(--mares)}
.btn.gold.solid{background:var(--mares);color:var(--bg)}
.tablewrap{overflow-x:auto;margin-top:20px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}

/* Lists */
.group{margin-bottom:20px}
.group h3{font-size:18px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.group h3 small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:14px}
.checks{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.checks li{border-bottom:1px solid var(--line)}
.checks li:last-child{border-bottom:0}
.checks label{display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.checks input{width:20px;height:20px;accent-color:var(--sea);flex:0 0 auto}
.checks input:checked + span{text-decoration:line-through;color:var(--muted)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 18px}
.progress i{display:block;height:100%;background:var(--sea);width:0;transition:width .3s}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}

/* Budget */
.budget{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.brow{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow small{display:block;color:var(--muted);font-size:13px}
.brow input{width:100%;text-align:right;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-variant-numeric:tabular-nums}
.total{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-top:14px;padding:16px;border-radius:var(--r);background:var(--sea);color:var(--bg)}
.total b{font-family:var(--display);font-size:32px;font-variant-numeric:tabular-nums}
.inline-field{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.inline-field select,.inline-field input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px}

/* Tips */
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tip h3{font-size:17px;margin-bottom:4px}
.tip p{margin:0;font-size:15px;color:var(--muted)}
.tip p b{color:var(--ink)}
.copy{font-variant-numeric:tabular-nums}
.foot{margin-top:28px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:12px}
.flights{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:18px}
.flights label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.flights input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;color:var(--ink)}

@media (max-width:520px){
  .pc{grid-template-columns:1fr}
  .days strong{font-size:18px}
  .brow{grid-template-columns:1fr 100px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lang{display:inline-flex;flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px}
.lang button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-weight:700;cursor:pointer;font-size:14px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--sea);color:var(--bg)}

<div class="wrap">

const done = store.get("done", {});
let cur = store.get("day", 0);
const DEP = new Date("2026-10-11T06:00:00+02:00");
const END = new Date("2026-10-15T23:59:00+02:00");
const now = new Date();
if (now >= DEP && now <= END){ const i = DAYS.findIndex(x=>x.n===now.getDate()); if(i>=0) cur = i; }

function countdown(){
  const n = new Date(), el = $("#count");
  if (n < DEP){
    const ms = DEP - n, d = Math.floor(ms/864e5), h = Math.floor(ms%864e5/36e5), m = Math.floor(ms%36e5/6e4);
    el.innerHTML = `<span>${t("cd_before")}</span><b>${d} ${t("cd_d")} ${h} ${t("cd_h")} ${m} ${t("cd_m")}</b>`;
  } else if (n <= END){
    el.innerHTML = `<b>${t("cd_during")}</b><span>${t("cd_during2")}</span>`;
  } else el.innerHTML = `<span>${t("cd_after")}</span>`;
}

function renderDays(){
  $("#days").innerHTML = DAYS.map((x,i)=>{
    const isToday = now.getFullYear()===2026 && now.getMonth()===9 && now.getDate()===x.n;
    return `<button type="button" aria-pressed="${i===cur}" data-i="${i}" class="${isToday?'today':''}" data-today="${t('today')}"><small>${DOWS[lang][i]}</small><strong>${x.n}.</strong></button>`;
  }).join("");
  const x = DAYS[cur];
  $("#day").innerHTML = `
    <div class="dayhead"><h3>${lang==="hu"?(cur+1)+". nap":"Deň "+(cur+1)} · ${esc(L(x.title))}</h3><span class="chip ${x.gold?'m':''}">${esc(L(x.chip))}</span></div>
    <p class="daynote">${esc(L(x.note))}</p>
    ${x.alert?`<div class="alert">${L(x.alert)}</div>`:""}
    <ol class="tl">${x.items.map((it,j)=>{
      const k = cur+"-"+j, on = !!done[k], det = L(it[2]);
      return `<li class="${on?'done':''}"><div class="row"><span class="time">${esc(it[0])}</span><div class="body"><div class="what">${esc(L(it[1]))}</div>${det?`<div class="det">${esc(det)}</div>`:""}${it[3]?`<div class="links"><a href="${nav(it[3])}" target="_blank" rel="noopener">${t("navigate")}</a><a href="${gm(it[3])}" target="_blank" rel="noopener">${t("onmap")}</a></div>`:""}</div><input class="tick" type="checkbox" id="d${k}" data-k="${k}" ${on?'checked':''} aria-label="${esc(t('done')+' '+L(it[1]))}"></div></li>`;
    }).join("")}</ol>
    <div class="planb"><b>${t("planb")}</b> ${esc(L(x.planb))}</div>`;
}
$("#days").addEventListener("click", e=>{ const b = e.target.closest("button"); if(!b) return; cur = +b.dataset.i; store.set("day", cur); renderDays(); });

const toMin = s => { const [h,m] = (s||"0:0").split(":").map(Number); return h*60+m; };
const fmt = m => { m = ((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); };
function renderRoad(){
  const out = toMin($("#f-out").value), back = toMin($("#f-back").value);
  const atAirport = out - 120, leave = atAirport - 125;
  const outNo = $("#f-outno").value.trim(), backNo = $("#f-backno").value.trim();
  const steps = [
    [fmt(leave),["Odchod z Trenčína","Indulás Trencsénből"],["D1 Trenčín → Bratislava, cez Petržalku na A6 (Kittsee) a A4 k letisku. Cca 170 km, 1 h 50 min + rezerva 15 min. Rakúska diaľničná známka je potrebná (digitálna alebo nálepka).","D1 Trencsén → Pozsony, Ligetfalun át az A6-ra (Kittsee), majd A4 a reptérig. Kb. 170 km, 1 óra 50 perc + 15 perc tartalék. Osztrák autópálya-matrica szükséges (digitális vagy ragasztós)."],"Flughafen Wien-Schwechat"],
    [fmt(atAirport-15),["Parkovanie pri letisku","Parkolás a reptéren"],["Parkovanie rezervovať online vopred – je lacnejšie ako na mieste.","A parkolást foglaljátok előre online – olcsóbb, mint a helyszínen."],"Flughafen Wien Parken"],
    [fmt(atAirport),["Letisko Viedeň, check-in a bezpečnostná kontrola","Bécsi reptér, check-in és biztonsági ellenőrzés"],["2 h pred odletom. Doklady pre deti: vlastný platný OP alebo pas.","2 órával indulás előtt. A gyerekeknek saját érvényes személyi igazolvány vagy útlevél kell."],null],
    [fmt(out),[ "Odlet do Palmy"+(outNo?" · "+outNo:""), "Indulás Palmába"+(outNo?" · "+outNo:"") ],["Let trvá cca 2 h 25 min.","A repülés kb. 2 óra 25 perc."],null],
    [fmt(out+145),["Pristátie v Palme","Leszállás Palmában"],"",null],
    [fmt(out+200),["Auto prevzaté, odchod na sever","Autó átvéve, indulás északra"],["Kontrola auta pred odchodom (fotky škrabancov), detské sedačky.","Indulás előtt nézzétek át az autót (fotók a karcolásokról), gyerekülések."],null]
  ];
  const backSteps = [
    [fmt(back-150),["Vrátenie auta na letisku PMI","Autó leadása a PMI reptéren"],["Plná nádrž podľa podmienok, fotky stavu auta.","Tele tank a feltételek szerint, fotók az autó állapotáról."],"Palma de Mallorca Airport"],
    [fmt(back-120),["Check-in a bezpečnostná kontrola","Check-in és biztonsági ellenőrzés"],"",null],
    [fmt(back),["Odlet do Viedne"+(backNo?" · "+backNo:""),"Indulás Bécsbe"+(backNo?" · "+backNo:"")],"",null],
    [fmt(back+150),["Pristátie vo Viedni","Leszállás Bécsben"],"",null],
    [fmt(back+190),["Odchod z parkoviska","Indulás a parkolóból"],"",null],
    [fmt(back+305),["Doma v Trenčíne","Otthon, Trencsénben"],"",null]
  ];
  const li = s => { const det = L(s[2]); return `<li><div class="row"><span class="time">${s[0]}</span><div class="body"><div class="what">${esc(L(s[1]))}</div>${det?`<div class="det">${esc(det)}</div>`:""}${s[3]?`<div class="links"><a href="${nav(s[3])}" target="_blank" rel="noopener">${t("navigate")}</a></div>`:""}</div></div></li>`; };
  $("#road-out").innerHTML = steps.map(li).join("");
  $("#road-back").innerHTML = backSteps.map(li).join("");
  const w = $("#roadwarn");
  if (leave < toMin("06:00")){ w.hidden = false; w.innerHTML = t("warn").replace("{t}", fmt(leave)); } else w.hidden = true;
}
fields.forEach(id=>document.getElementById(id).addEventListener("input", e=>{ store.set(id, e.target.value); renderRoad(); }));

 [["Pred odchodom","Indulás előtt"],[["Online check-in na lety","Online check-in a járatokra"],["Skontrolovať tlak v pneumatikách auta na cestu do Viedne","Guminyomás ellenőrzése a bécsi útra"],["Vyniesť smeti, zalievanie kvetov","Szemét kivitele, virágöntözés"],["Stiahnuť offline mapy","Offline térképek letöltése"]]]
];
const packed = store.get("packed", {});
const extra = store.get("extra2", {});
function renderPack(){
  let total = 0, n = 0;
  $("#pack").innerHTML = PACK.map((g,gi)=>{
    const items = g[1].map(L).concat(extra[gi]||[]);
    const c = items.filter((_,i)=>packed[gi+"-"+i]).length; total += items.length; n += c;
    return `<div class="group"><h3>${esc(L(g[0]))} <small>${c}/${items.length}</small></h3>
      <ul class="checks">${items.map((it,i)=>{const k=gi+"-"+i;return `<li><label for="pk${k}"><input type="checkbox" id="pk${k}" data-pk="${k}" ${packed[k]?'checked':''}><span>${esc(it)}</span></label></li>`;}).join("")}</ul>
      <form class="addrow" data-g="${gi}"><input id="add${gi}" type="text" placeholder="${t('addph')}" aria-label="${esc(t('addph'))}"><button class="btn" type="submit">${t("add")}</button></form></div>`;
  }).join("");
  $("#packbar").style.width = (total? n/total*100 : 0) + "%";
}
$("#pack").addEventListener("change", e=>{ const k = e.target.dataset.pk; if(!k) return; packed[k] = e.target.checked; store.set("packed", packed); renderPack(); });
$("#pack").addEventListener("submit", e=>{ e.preventDefault(); const f = e.target, g = f.dataset.g, v = f.querySelector("input").value.trim(); if(!v) return; (extra[g] = extra[g]||[]).push(v); store.set("extra2", extra); renderPack(); });

 ["misc",["Rezerva","Tartalék"],["zmrzlina, suveníry, nečakané","fagyi, ajándékok, váratlan kiadások"],100]
];
const bv = store.get("budget", {});
function syncBudgetStay(fromFav){
  const sel = $("#b-stay");
  sel.value = fromFav ? fav : store.get("bstay", fav);
  const s = STAYS.find(x=>x.id===sel.value) || STAYS[0];
  const saved = store.get("bnight_"+s.id, null);
  $("#b-night").value = saved!==null ? saved : Math.round((s.price[0]+s.price[1])/2/5)*5;
  calc();
}
function renderBudget(){
  const keep = {}; BUD.forEach(b=>{ const el = document.getElementById("b-"+b[0]); if(el) keep[b[0]] = el.value; });
  $("#b-stay").innerHTML = STAYS.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");
  $("#budget").innerHTML = BUD.map(b=>{ const v = keep[b[0]]!==undefined ? keep[b[0]] : (bv[b[0]]!==undefined?bv[b[0]]:b[3]);
    return `<div class="brow"><label for="b-${b[0]}">${esc(L(b[1]))}<small>${esc(L(b[2]))}</small></label><input id="b-${b[0]}" type="number" min="0" step="5" data-b="${b[0]}" value="${esc(v)}"></div>`; }).join("");
}
function calc(){
  let s = (+$("#b-night").value||0)*4;
  BUD.forEach(b=>{ s += +document.getElementById("b-"+b[0]).value || 0; });
  $("#btotal").textContent = s.toLocaleString(lang==="hu"?"hu-HU":"sk-SK") + " €";
}
$("#budget").addEventListener("input", e=>{ const k = e.target.dataset.b; if(!k) return; bv[k] = e.target.value; store.set("budget", bv); calc(); });
$("#b-stay").addEventListener("change", e=>{ store.set("bstay", e.target.value); fav = e.target.value; store.set("fav", fav); renderStays(); syncBudgetStay(true); });
$("#b-night").addEventListener("input", e=>{ store.set("bnight_"+$("#b-stay").value, e.target.value); calc(); });

function renderTips(){ $("#tips").innerHTML = TIPS.map(x=>`<div class="tip"><h3>${esc(L(x[0]))}</h3><p>${L(x[1])}</p></div>`).join(""); }

/* ---------- Tabs ---------- */
const tabs = document.querySelectorAll("nav.tabs button");
function show(id){
  tabs.forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===id));
  document.querySelectorAll("section.panel").forEach(p=>p.hidden = p.id!=="p-"+id);
  store.set("tab", id);
}
tabs.forEach(b=>b.addEventListener("click", ()=>{ show(b.dataset.tab); window.scrollTo({top:0}); }));

/* ---------- Language ---------- */
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = t(el.dataset.t); });
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  $("#tabsnav").setAttribute("aria-label", lang==="hu"?"Szakaszok":"Sekcie");
  countdown(); renderDays(); renderStays(); renderRoad(); renderPack(); renderBudget(); syncBudgetStay(false); renderTips();
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click", ()=>{ lang = b.dataset.lang; store.set("lang", lang); applyLang(); }));

applyLang();
setInterval(countdown, 30000);
const h = (location.hash||"").slice(1);
if (h==="hu" || h==="sk"){ lang = h; applyLang(); }
show(["plan","stay","road","pack","money","tips"].includes(h) ? h : store.get("tab","plan"));
})();
